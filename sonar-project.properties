# SonarQube Project Configuration
sonar.projectKey=sagility
sonar.projectName=Sagility
sonar.projectVersion=1.0

# Source code location
sonar.sources=frontend-vite/src,backend/app,backend/main.py
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/venv/**,**/__pycache__/**,**/*.pyc,**/migrations/**,**/alembic/**

# Test exclusions
sonar.test.exclusions=**/test/**,**/tests/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*_test.py

# Language settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml

# TypeScript/JavaScript settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Python settings
sonar.python.file.suffixes=.py

# Frontend specific
sonar.javascript.lcov.reportPaths=frontend-vite/coverage/lcov.info

# Backend specific
sonar.python.coverage.reportPaths=backend/coverage.xml

